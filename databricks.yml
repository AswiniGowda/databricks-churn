bundle:
  name: mlops_telco_churn

variables:
  catalog:
    description: Unity Catalog catalog to use
  schema:
    default: mlops_dev

include:
  - resources/*.yml

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-7405606210469469.9.azuredatabricks.net
    variables:
      catalog: mlops_learning
      schema: mlops_dev
  prod:
    workspace:
      host: https://adb-7405606210469469.9.azuredatabricks.net
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: mlops_learning
      schema: mlops_prod